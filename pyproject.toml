[project]
name = "ikaros-data-feed"
version = "0.1.0"
description = "Market data ingestion for Daedalus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    # Existing ingestion uses OpenBB v4 provider-specific API.
    "openbb==4.7.2",
]

[project.optional-dependencies]
snowflake = [
    # Conservative range for compatibility with Daedalus connector usage.
    "snowflake-connector-python[pandas]>=4,<5",
]
dev = [
    "pytest>=8,<10",
]
kafka = [
    "confluent-kafka>=2.6,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
