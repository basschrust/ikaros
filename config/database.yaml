# Use IKAROS_DB_DRIVER in .env to override the default backend.
# When DuckDB is selected, IKAROS_MARKET_DATA_DIR identifies the directory
# holding ikaros.duckdb (it can point to Daedalus/input/market_data).
database:
  driver: duckdb
  duckdb: {}
  snowflake:
    database: DAEDALUS
    schema: MARKET_DATA
    warehouse: DAEDALUS_WH
    authenticator: snowflake
    # Never put passwords, TOTP codes, or private keys in this YAML.
